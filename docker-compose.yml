# One way to run slskd, which j-seeker needs: docker compose up -d
# SLSKD_API_KEY, MUSIC_DIR and SLSKD_DIR are read from .env next to this file (see .env.example).
# Create the two folders first; if Docker creates them, they're owned by root and slskd can't write to them.

services:
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "5030:5030"    # web UI and API
      # Soulseek peer connections; forward this on your router. Both sides must match slskd's listen port.
      - "${SLSKD_LISTEN_PORT:-50300}:${SLSKD_LISTEN_PORT:-50300}"
    environment:
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SLSKD_SLSK_LISTEN_PORT: ${SLSKD_LISTEN_PORT:-50300}
      SLSKD_REMOTE_CONFIGURATION: "true"
      TZ: ${TZ:-}
    volumes:
      - ${SLSKD_DIR:-~/slskd}:/app
      - ${MUSIC_DIR:-~/Music/DJLibrary}:/downloads
    restart: unless-stopped
